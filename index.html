<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Happ — BOSSKIN</title>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111;
    }
    .card {
        width: 100%;
        max-width: 390px;
        padding: 32px 24px 25px;
        background: #fff;
        border-radius: 28px;
        text-align: center;
        box-shadow: 0 8px 35px rgba(0, 0, 0, 0.06);
    }
    .app-icon {
        width: 100px;
        height: 100px;
        margin: 0 auto 20px;
        border-radius: 24px;
        background: linear-gradient(145deg, #252b38, #090b11);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 43px;
        font-weight: 700;
        letter-spacing: -3px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
    }
    h1 {
        margin: 0 0 8px;
        font-size: 27px;
        font-weight: 700;
    }
    .subtitle {
        margin: 0 0 25px;
        color: #8e8e93;
        font-size: 14px;
    }
    .info {
        margin-bottom: 25px;
        padding: 15px;
        background: #f5f5f7;
        border-radius: 16px;
        text-align: left;
    }
    .info-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0;
        font-size: 14px;
    }
    .info-row span:first-child {
        color: #8e8e93;
    }
    .info-row span:last-child {
        font-weight: 600;
    }
    .install-button {
        display: block;
        width: 100%;
        padding: 17px;
        border-radius: 16px;
        background: #111;
        color: #fff;
        text-decoration: none;
        font-size: 16px;
        font-weight: 650;
        transition: opacity .2s;
    }
    .install-button:active {
        opacity: .7;
    }
    .note {
        margin: 16px 4px 0;
        color: #8e8e93;
        font-size: 12px;
        line-height: 1.5;
    }
    .footer {
        margin-top: 28px;
        color: #b0b0b5;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
    }
</style>
</head>
<body>
    <main class="card">
    <div class="app-icon">H</div>
    <h1>Happ</h1>
    <p class="subtitle">Proxy Utility</p>
    <div class="info">
        <div class="info-row">
            <span>Версия</span>
            <span>6.4.0</span>
        </div>
        <div class="info-row">
            <span>Build</span>
            <span>2611051057</span>
        </div>
        <div class="info-row">
            <span>Платформа</span>
            <span>iOS</span>
        </div>
    </div>
    <a class="install-button"
       href="itms-services://?action=download-manifest&url=https://bosskin-pro.github.io/happ-ipa/manifest.plist">
        Установить приложение
    </a>
    <p class="note">
        Откройте эту страницу на iPhone или iPad
        и нажмите кнопку установки.
    </p>
    <div class="footer">BOSSKIN</div>
</main>
</body>
</html>
